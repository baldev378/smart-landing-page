<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape-Shifter Interactive Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-7xl mx-auto">
        <!-- Control Panel Header -->
        <div class="glass-panel p-6 rounded-2xl mb-8 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
            <div>
                <div class="flex items-center gap-3 mb-2">
                    <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 rounded-full text-xs font-semibold uppercase tracking-wider">Live Control Panel</span>
                    <h1 class="text-2xl font-bold">Shape-Shifter Personalization Sandbox</h1>
                </div>
                <p class="text-slate-400 text-xs">Simulate visitor cities, native script greetings, local weather, and currency formatting in real-time.</p>
            </div>

            <!-- Simulation Controls -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full lg:w-auto">
                <!-- City Selector -->
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-slate-400 mb-1">Target Location</label>
                    <select id="sim-city" onchange="updateSimulation()" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-xs focus:border-amber-500 outline-none">
                        <option value="Dubai" selected>Dubai (AED د.إ)</option>
                        <option value="London">London (GBP £)</option>
                        <option value="New York">New York (USD $)</option>
                        <option value="Paris">Paris (EUR €)</option>
                        <option value="Tokyo">Tokyo (JPY ¥)</option>
                    </select>
                </div>

                <!-- Weather Selector -->
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-slate-400 mb-1">Live Weather</label>
                    <select id="sim-weather" onchange="updateSimulation()" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-xs focus:border-amber-500 outline-none">
                        <option value="Clear">Sunny / Clear</option>
                        <option value="Rainy">Rainy / Cold</option>
                        <option value="Snow">Snow / Winter</option>
                    </select>
                </div>

                <!-- View Mode Selector -->
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-slate-400 mb-1">Device Mode</label>
                    <select id="sim-device" onchange="updateSimulation()" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-xs focus:border-amber-500 outline-none">
                        <option value="desktop">Desktop (100%)</option>
                        <option value="mobile">Mobile (375px)</option>
                    </select>
                </div>

                <!-- Apply Simulation Button -->
                <div class="flex items-end">
                    <button onclick="updateSimulation()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded-lg text-xs uppercase tracking-wider transition">
                        Trigger Shift
                    </button>
                </div>
            </div>
        </div>

        <!-- Live Preview Iframe Container -->
        <div class="glass-panel rounded-2xl p-4 flex justify-center items-center">
            <iframe id="preview-frame" src="index.html" class="w-full h-[800px] rounded-xl border border-slate-800 transition-all duration-500"></iframe>
        </div>
    </div>

    <script>
        function updateSimulation() {
            const city = document.getElementById('sim-city').value;
            const weather = document.getElementById('sim-weather').value;
            const device = document.getElementById('sim-device').value;
            const iframe = document.getElementById('preview-frame');

            if (device === 'mobile') {
                iframe.style.width = '375px';
            } else {
                iframe.style.width = '100%';
            }

            iframe.contentWindow.postMessage({
                type: 'SHAPESHIFTER_SIMULATE',
                city: city,
                weather: weather
            }, '*');
        }
    </script>
</body>
</html>
