<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape-Shifter Sandbox Control Panel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Standalone Native Pure CSS (Zero Third-Party CDNs) -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Jost', sans-serif; background-color: #0b0f19; color: #f8fafc; padding: 24px; }
        
        .container { max-width: 1300px; margin: 0 auto; }
        
        .control-panel { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 24px; border-radius: 16px; margin-bottom: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; }
        
        .badge { display: inline-block; padding: 4px 12px; background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 20px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 8px; }
        .panel-title { font-size: 22px; font-weight: 700; color: #ffffff; }
        .panel-desc { font-size: 12px; color: #94a3b8; margin-top: 4px; }

        .control-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; width: 100%; max-width: 650px; }
        
        .field-group { display: flex; flex-direction: column; }
        .field-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: #94a3b8; margin-bottom: 6px; }
        
        .select-input { width: 100%; background: #0f172a; border: 1px solid #334155; color: #ffffff; padding: 8px 12px; border-radius: 8px; font-size: 12px; outline: none; font-family: 'Jost', sans-serif; }
        .select-input:focus { border-color: #f59e0b; }

        .btn-trigger { width: 100%; background: #f59e0b; color: #090d16; font-weight: 700; padding: 9px 12px; border: none; border-radius: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; cursor: pointer; transition: background 0.2s; margin-top: 18px; }
        .btn-trigger:hover { background: #d97706; }

        .iframe-container { background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 16px; display: flex; justify-content: center; align-items: center; }
        .preview-iframe { width: 100%; height: 820px; border-radius: 12px; border: 1px solid #1e293b; transition: width 0.5s ease; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Control Panel Header -->
        <div class="control-panel">
            <div>
                <div>
                    <span class="badge">Enterprise Sandbox</span>
                    <h1 class="panel-title">Shape-Shifter Control Panel</h1>
                </div>
                <p class="panel-desc">Simulate visitor cities, native script greetings, rain/snow particle visual effects, and weather product grids.</p>
            </div>

            <!-- Controls Selector Grid -->
            <div class="control-grid">
                <div class="field-group">
                    <label class="field-label">Target City</label>
                    <select id="sim-city" onchange="updateSimulation()" class="select-input">
                        <option value="Dubai" selected>Dubai (AED د.إ)</option>
                        <option value="London">London (GBP £)</option>
                        <option value="New York">New York (USD $)</option>
                        <option value="Paris">Paris (EUR €)</option>
                        <option value="Tokyo">Tokyo (JPY ¥)</option>
                    </select>
                </div>

                <div class="field-group">
                    <label class="field-label">Live Weather</label>
                    <select id="sim-weather" onchange="updateSimulation()" class="select-input">
                        <option value="Clear">Sunny / Clear</option>
                        <option value="Rainy">Rainy (Rain Visual)</option>
                        <option value="Snow">Snow (Snow Visual)</option>
                    </select>
                </div>

                <div class="field-group">
                    <label class="field-label">Device View</label>
                    <select id="sim-device" onchange="updateSimulation()" class="select-input">
                        <option value="desktop">Desktop View</option>
                        <option value="mobile">Mobile View</option>
                    </select>
                </div>

                <div class="field-group">
                    <button onclick="updateSimulation()" class="btn-trigger">Trigger Shift</button>
                </div>
            </div>
        </div>

        <!-- Live Preview Frame Container -->
        <div class="iframe-container">
            <iframe id="preview-frame" src="index.html" class="preview-iframe"></iframe>
        </div>
    </div>

    <script>
        function updateSimulation() {
            const city = document.getElementById('sim-city').value;
            const weather = document.getElementById('sim-weather').value;
            const device = document.getElementById('sim-device').value;
            const iframe = document.getElementById('preview-frame');

            if (device === 'mobile') {
                iframe.style.width = '375px';
            } else {
                iframe.style.width = '100%';
            }

            iframe.contentWindow.postMessage({
                type: 'SHAPESHIFTER_SIMULATE',
                city: city,
                weather: weather
            }, '*');
        }
    </script>
</body>
</html>
