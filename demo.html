<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape-Shifter Interactive Sandbox Control Panel</title>
    
    <!-- Clean Compiled Tailwind CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Jost', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-7xl mx-auto">
        <!-- Control Panel Bar -->
        <div class="glass-panel p-6 rounded-2xl mb-8 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
            <div>
                <div class="flex items-center gap-3 mb-1">
                    <span class="px-3 py-1 bg-amber-500 bg-opacity-20 text-amber-400 border border-amber-500 border-opacity-40 rounded-full text-xs font-semibold uppercase tracking-widest">Enterprise Sandbox</span>
                    <h1 class="text-2xl font-bold tracking-wide">Shape-Shifter Control Panel</h1>
                </div>
                <p class="text-gray-400 text-xs">Simulate visitor locations, native script greetings, rain/snow particle visual effects, and weather product grids.</p>
            </div>

            <!-- Controls Selector Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full lg:w-auto">
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Target City</label>
                    <select id="sim-city" onchange="updateSimulation()" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2 text-xs outline-none focus:border-amber-500">
                        <option value="Dubai" selected>Dubai (AED د.إ)</option>
                        <option value="London">London (GBP £)</option>
                        <option value="New York">New York (USD $)</option>
                        <option value="Paris">Paris (EUR €)</option>
                        <option value="Tokyo">Tokyo (JPY ¥)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Live Weather</label>
                    <select id="sim-weather" onchange="updateSimulation()" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2 text-xs outline-none focus:border-amber-500">
                        <option value="Clear">Sunny / Clear</option>
                        <option value="Rainy">Rainy (Rain Visual)</option>
                        <option value="Snow">Snow (Snow Visual)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Device View</label>
                    <select id="sim-device" onchange="updateSimulation()" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2 text-xs outline-none focus:border-amber-500">
                        <option value="desktop">Desktop View</option>
                        <option value="mobile">Mobile View</option>
                    </select>
                </div>

                <div class="flex items-end">
                    <button onclick="updateSimulation()" class="w-full bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold py-2 rounded-lg text-xs uppercase tracking-wider transition">
                        Trigger Shift
                    </button>
                </div>
            </div>
        </div>

        <!-- Live Preview Frame Container -->
        <div class="glass-panel rounded-2xl p-4 flex justify-center items-center">
            <iframe id="preview-frame" src="index.html" class="w-full h-screen rounded-xl border border-gray-800 transition-all duration-500"></iframe>
        </div>
    </div>

    <script>
        function updateSimulation() {
            const city = document.getElementById('sim-city').value;
            const weather = document.getElementById('sim-weather').value;
            const device = document.getElementById('sim-device').value;
            const iframe = document.getElementById('preview-frame');

            if (device === 'mobile') {
                iframe.style.width = '375px';
            } else {
                iframe.style.width = '100%';
            }

            iframe.contentWindow.postMessage({
                type: 'SHAPESHIFTER_SIMULATE',
                city: city,
                weather: weather
            }, '*');
        }
    </script>
</body>
</html>
