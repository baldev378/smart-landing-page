<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shape-Shifter Sales Control Panel</title>
  <script>
    console.warn = () => {}; 
    console.info = () => {};
  </script>
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white p-6">
  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
    <!-- Sidebar -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
      <h2 class="font-bold mb-4 text-yellow-500">CONTROL PANEL</h2>
      <form onsubmit="event.preventDefault(); updatePreview();" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">City</label>
          <select id="s_city" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-sm">
            <option value="Sahibzada Ajit Singh Nagar">Mohali (SAS Nagar)</option>
            <option value="Mumbai">Mumbai</option>
            <option value="London">London</option>
            <option value="New York">New York</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Weather</label>
          <select id="s_weather" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-sm">
            <option value="Clear">Clear</option>
            <option value="Rain">Rain</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-indigo-600 p-3 rounded-xl font-bold hover:bg-indigo-500">Mutate Page</button>
      </form>
    </div>
    
    <!-- Preview -->
    <div class="lg:col-span-3">
      <div class="bg-gray-800 p-2 rounded-t-2xl border-t border-l border-r border-gray-700 text-xs text-gray-500 px-4">
        Live Client View: <span id="url-text">index.html</span>
      </div>
      <iframe id="preview" src="index.html" class="w-full h-[700px] rounded-b-2xl border border-gray-700 bg-white"></iframe>
    </div>
  </div>

  <script>
    function updatePreview() {
      const city = document.getElementById('s_city').value;
      const weather = document.getElementById('s_weather').value;
      const country = (city === 'London') ? 'GB' : (city === 'New York') ? 'US' : 'IN';
      
      const query = `index.html?city=${encodeURIComponent(city)}&country=${country}&weather=${weather}`;
      document.getElementById('url-text').innerText = query;
      document.getElementById('preview').src = query;
    }
  </script>
</body>
</html>
