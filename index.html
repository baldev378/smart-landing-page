<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape-Shifter | Enterprise Personalization</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #C5A059; } /* Luxury Gold */
        .luxury-serif { font-family: 'Playfair Display', serif; }
        .premium-sans { font-family: 'Montserrat', sans-serif; }
        .glass-dark { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(197, 160, 89, 0.2); }
        .hero-bg { transition: background-image 0.8s ease-in-out; background-size: cover; background-position: center; }
        .gold-border { border-color: #C5A059; }
        .text-gold { color: #C5A059; }
    </style>
</head>
<body class="bg-black text-white premium-sans overflow-x-hidden">

    <!-- Dynamic Hero Section -->
    <section id="hero" class="relative h-screen w-full flex items-center justify-center hero-bg" style="background-image: url('https://images.unsplash.com/photo-1547949003-9792a18a2601?auto=format&fit=crop&q=80&w=2000');">
        <div class="absolute inset-0 bg-black/50"></div>
        
        <div class="relative z-10 text-center px-4 max-w-4xl">
            <div id="greeting-box" class="mb-6 inline-block px-6 py-2 glass-dark rounded-full border border-white/20 animate-fade-in">
                <span id="visitor-greeting" class="text-sm tracking-[0.2em] uppercase">Welcome to the Collection</span>
            </div>
            
            <h1 id="dynamic-headline" class="luxury-serif text-5xl md:text-7xl mb-8 leading-tight">
                Exquisite Pieces for <span class="text-gold italic" id="city-name">Global Collectors</span>
            </h1>

            <div class="flex flex-col md:flex-row gap-6 justify-center items-center">
                <a href="#" class="px-10 py-4 bg-[#C5A059] text-black font-semibold hover:bg-white transition duration-300 tracking-widest uppercase text-xs">Explore Inventory</a>
                <div id="shipping-timer" class="text-sm border-l border-gold pl-6 text-left hidden md:block">
                    <p class="text-white/60 uppercase tracking-tighter text-[10px]">Concierge Delivery to <span id="target-city" class="text-white font-bold">Your Location</span></p>
                    <p id="countdown" class="text-lg font-light">04:12:55</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Weather-Adaptive Luxury Grid -->
    <section class="py-24 px-6 bg-[#0a0a0a]">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-end mb-16">
                <div>
                    <h2 class="luxury-serif text-4xl mb-2">Curated for You</h2>
                    <p id="weather-status" class="text-gold tracking-widest uppercase text-[10px]">Detected: Clear Skies in London</p>
                </div>
                <div class="hidden md:block text-right">
                    <span id="local-currency" class="text-2xl font-light">GBP £</span>
                </div>
            </div>

            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-12">
                <!-- Products injected via shapeshifter.js -->
            </div>
        </div>
    </section>

    <!-- Dynamic Script Integration -->
    <script src="shapeshifter.js"></script>
    <script>
        // Data for Luxury Demo
        const luxuryProducts = [
            { name: "Hermès Birkin 25", price: "£24,500", img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=800", weather: "Clear" },
            { name: "Rolex Day-Date Gold", price: "£32,000", img: "https://images.unsplash.com/photo-1587836374828-4dbaba94ee0e?q=80&w=800", weather: "Clear" },
            { name: "Chanel Classic Flap", price: "£8,900", img: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?q=80&w=800", weather: "Rainy" }
        ];

        function renderLuxuryProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = luxuryProducts.map(p => `
                <div class="group cursor-pointer">
                    <div class="overflow-hidden mb-6 aspect-[3/4] bg-[#1a1a1a]">
                        <img src="${p.img}" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition duration-700 scale-100 group-hover:scale-110">
                    </div>
                    <h3 class="luxury-serif text-xl mb-1">${p.name}</h3>
                    <p class="text-gold font-light tracking-widest">${p.price}</p>
                </div>
            `).join('');
        }
        renderLuxuryProducts();
    </script>
</body>
</html>
