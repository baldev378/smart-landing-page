<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Personalizing Landing Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; }
        
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            transition: all 0.5s ease;
        }

        .hero.loading #headline, .hero.loading #subheadline {
            opacity: 0.5;
            filter: blur(4px);
        }
        
        #headline {
            font-size: 3.2rem;
            font-weight: 800;
            max-width: 850px;
            margin-bottom: 24px;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        
        #subheadline {
            font-size: 1.35rem;
            max-width: 650px;
            margin-bottom: 40px;
            opacity: 0.9;
            line-height: 1.6;
            color: #c7d2fe;
        }
        
        #cta-button {
            padding: 18px 48px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: #f43f5e;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        
        #cta-button:hover { transform: translateY(-2px) scale(1.03); background: #e11d48; }
        
        #personalization-badge {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #38bdf8;
            padding: 12px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        
        #social-proof {
            background: #020617;
            padding: 30px 20px;
            text-align: center;
            font-size: 1.1rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        @media (max-width: 768px) {
            #headline { font-size: 2.2rem; }
            #subheadline { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<div class="hero loading" id="hero-section">
    <h1 id="headline">Transform Your Business Today</h1>
    <p id="subheadline">The smartest solution for modern entrepreneurs who want to scale fast.</p>
    <button id="cta-button">Get Started Free</button>
</div>

<div id="social-proof">
    <p id="proof-text">Trusted by 10,000+ businesses worldwide</p>
</div>

<div id="personalization-badge">
    🎯 Personalized for <span id="user-location-tag">you</span>
</div>

<script>
// ============================================
// CONFIGURATION - Put your API keys here
// ============================================
const CONFIG = {
    makeWebhookURL: 'YOUR_MAKE_WEBHOOK_URL_HERE', // We will fill this tomorrow
    geoAPIKey: '7398ebebcefe4b4f93212ac3398f6c0c',
    weatherAPIKey: '3c80e4b09092cf081fa5c254601ae3f3'
};

// 1. Get URL UTM Parameters
function getUTMParams() {
    const params = new URLSearchParams(window.location.search);
    return {
        utm_source: params.get('utm_source') || 'direct',
        utm_medium: params.get('utm_medium') || 'none',
        utm_campaign: params.get('utm_campaign') || 'none',
        utm_content: params.get('utm_content') || 'none',
        utm_term: params.get('utm_term') || 'none'
    };
}

// 2. Detect Device Type
function getDeviceType() {
    const width = window.innerWidth;
    if (width < 768) return 'mobile';
    if (width < 1024) return 'tablet';
    return 'desktop';
}

// 3. Detect Visitor Location
async function getUserLocation() {
    try {
        const response = await fetch(`https://api.ipgeolocation.io/ipgeo?apiKey=${CONFIG.geoAPIKey}`);
        const data = await response.json();
        return {
            city: data.city || 'Unknown',
            country: data.country_name || 'Unknown',
            region: data.state_prov || 'Unknown',
            latitude: data.latitude,
            longitude: data.longitude
        };
    } catch (error) {
        console.warn('Geolocation lookup failed:', error);
        return { city: 'Unknown', country: 'Unknown', region: 'Unknown' };
    }
}

// 4. Detect Weather at Visitor Location
async function getWeather(lat, lon) {
    if (!lat || !lon) return { condition: 'Clear', temperature: 70 };
    try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=imperial&appid=${CONFIG.weatherAPIKey}`);
        const data = await response.json();
        return {
            condition: data.weather?.[0]?.main || 'Clear',
            description: data.weather?.[0]?.description || 'clear sky',
            temperature: Math.round(data.main?.temp || 70)
        };
    } catch (error) {
        console.warn('Weather API failed:', error);
        return { condition: 'Clear', description: 'clear sky', temperature: 70 };
    }
}

// 5. Detect Local Time Context
function getTimeContext() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour < 12) return 'morning';
    if (hour >= 12 && hour < 17) return 'afternoon';
    if (hour >= 17 && hour < 21) return 'evening';
    return 'night';
}

// 6. Master Function: Gather Everything & Run Test Update
async function shapeShift() {
    console.log('🔄 Shape-Shifter data collection started...');
    const hero = document.getElementById('hero-section');
    
    // Gather client profile data
    const utm = getUTMParams();
    const device = getDeviceType();
    const location = await getUserLocation();
    const weather = await getWeather(location.latitude, location.longitude);
    const timeOfDay = getTimeContext();

    const userData = { utm, device, location, weather, timeOfDay, timestamp: new Date().toISOString() };
    console.log('📊 Collected Visitor Data Payload:', userData);

    // Remove loading blur
    hero.classList.remove('loading');

    // Show location tag on badge if city detected
    if (location.city !== 'Unknown') {
        document.getElementById('user-location-tag').textContent = `${location.city}, ${location.country}`;
        document.getElementById('personalization-badge').style.display = 'block';
    }
}

document.addEventListener('DOMContentLoaded', shapeShift);
</script>

</body>
</html>
