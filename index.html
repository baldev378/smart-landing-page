<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Personalizing Landing Page</title>
   <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; }
    
    .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
        transition: background 0.5s ease, opacity 0.3s ease;
    }

    /* Skeleton Loading Effect */
    .skeleton-loading #headline {
        background: rgba(255, 255, 255, 0.15);
        color: transparent !important;
        border-radius: 12px;
        animation: shimmer 1.5s infinite ease-in-out;
        user-select: none;
    }

    .skeleton-loading #subheadline {
        background: rgba(255, 255, 255, 0.1);
        color: transparent !important;
        border-radius: 8px;
        animation: shimmer 1.5s infinite ease-in-out;
        animation-delay: 0.2s;
        user-select: none;
    }

    @keyframes shimmer {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
    }

    #headline {
        font-size: 3.2rem;
        font-weight: 800;
        max-width: 850px;
        margin-bottom: 24px;
        line-height: 1.2;
        letter-spacing: -0.02em;
    }
    
    #subheadline {
        font-size: 1.35rem;
        max-width: 650px;
        margin-bottom: 40px;
        opacity: 0.9;
        line-height: 1.6;
        color: #c7d2fe;
    }
    
    #cta-button {
        padding: 18px 48px;
        font-size: 1.2rem;
        font-weight: 700;
        border: none;
        border-radius: 50px;
        background: #f43f5e;
        color: white;
        cursor: pointer;
        box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.4);
        transition: transform 0.2s ease, background 0.2s ease;
    }
    
    #cta-button:hover { transform: translateY(-2px) scale(1.03); background: #e11d48; }
    
    #personalization-badge {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.1);
        color: #38bdf8;
        padding: 12px 18px;
        border-radius: 50px;
        font-size: 0.85rem;
        font-weight: 600;
        display: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    
    #social-proof {
        background: #020617;
        padding: 30px 20px;
        text-align: center;
        font-size: 1.1rem;
        color: #94a3b8;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

    @media (max-width: 768px) {
        #headline { font-size: 2.2rem; }
        #subheadline { font-size: 1.1rem; }
    }
</style>
</head>
<body>

<div class="hero loading" id="hero-section">
    <h1 id="headline">Transform Your Business Today</h1>
    <p id="subheadline">The smartest solution for modern entrepreneurs who want to scale fast.</p>
    <button id="cta-button">Get Started Free</button>
</div>

<div id="social-proof">
    <p id="proof-text">Trusted by 10,000+ businesses worldwide</p>
</div>

<div id="personalization-badge">
    🎯 Personalized for <span id="user-location-tag">you</span>
</div>
<script>
// ============================================
// CONFIGURATION
// ============================================
const CONFIG = {
    makeWebhookURL: 'https://hook.eu1.make.com/md9pqolt364tc5l29i2l0zg6qblc501d', // We will fill this tomorrow
    geoAPIKey: '7398ebebcefe4b4f93212ac3398f6c0c',
    weatherAPIKey: '3c80e4b09092cf081fa5c254601ae3f3',
    // CLIENT INDUSTRY CONFIGURATION
    templateId: 'ecommerce', // Options: 'ecommerce', 'saas', 'local_service', 'real_estate', 'fitness'
    brandName: 'StormShield Co.',
    productDescription: 'Premium waterproof jackets and outdoor gear for all-weather adventurers.'
};

// 1. Get URL UTM Parameters
function getUTMParams() {
    const params = new URLSearchParams(window.location.search);
    return {
        utm_source: params.get('utm_source') || 'direct',
        utm_medium: params.get('utm_medium') || 'none',
        utm_campaign: params.get('utm_campaign') || 'none',
        utm_content: params.get('utm_content') || 'none',
        utm_term: params.get('utm_term') || 'none'
    };
}

// 2. Detect Device Type
function getDeviceType() {
    const width = window.innerWidth;
    if (width < 768) return 'mobile';
    if (width < 1024) return 'tablet';
    return 'desktop';
}

// 3. Detect Visitor Location
async function getUserLocation() {
    try {
        const response = await fetch(`https://api.ipgeolocation.io/ipgeo?apiKey=${CONFIG.geoAPIKey}`);
        const data = await response.json();
        return {
            city: data.city || 'Unknown',
            country: data.country_name || 'Unknown',
            region: data.state_prov || 'Unknown',
            latitude: data.latitude,
            longitude: data.longitude
        };
    } catch (error) {
        console.warn('Geolocation lookup failed:', error);
        return { city: 'Unknown', country: 'Unknown', region: 'Unknown' };
    }
}

// 4. Detect Weather at Visitor Location
async function getWeather(lat, lon) {
    if (!lat || !lon) return { condition: 'Clear', temperature: 70 };
    try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=imperial&appid=${CONFIG.weatherAPIKey}`);
        const data = await response.json();
        return {
            condition: data.weather?.[0]?.main || 'Clear',
            description: data.weather?.[0]?.description || 'clear sky',
            temperature: Math.round(data.main?.temp || 70)
        };
    } catch (error) {
        console.warn('Weather API failed:', error);
        return { condition: 'Clear', description: 'clear sky', temperature: 70 };
    }
}

// 5. Detect Local Time Context
function getTimeContext() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour < 12) return 'morning';
    if (hour >= 12 && hour < 17) return 'afternoon';
    if (hour >= 17 && hour < 21) return 'evening';
    return 'night';
}

// 6. Send payload to Make.com Webhook & Get Personalized AI Content
async function getPersonalizedContent(userData) {
    if (!CONFIG.makeWebhookURL || CONFIG.makeWebhookURL.includes('YOUR_MAKE_WEBHOOK')) {
        console.warn('⚠️ Webhook URL not set yet.');
        return null;
    }
    try {
        const response = await fetch(CONFIG.makeWebhookURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
        });
        const data = await response.json();
        return data;
    } catch (error) {
        console.error('Personalization fetch failed:', error);
        return null;
    }
}

// 7. Update Page DOM Elements
function updatePage(content) {
    if (!content) return;

    const hero = document.getElementById('hero-section');
    hero.style.opacity = '0';

    setTimeout(() => {
        if (content.headline) document.getElementById('headline').textContent = content.headline;
        if (content.subheadline) document.getElementById('subheadline').textContent = content.subheadline;
        if (content.cta) document.getElementById('cta-button').textContent = content.cta;
        if (content.proofText) document.getElementById('proof-text').textContent = content.proofText;
        if (content.backgroundColor) hero.style.background = content.backgroundColor;

        hero.style.opacity = '1';
    }, 300);
}

// 8. MASTER FUNCTION
async function shapeShift() {
    console.log('🔄 Shape-Shifter data collection started...');
    const hero = document.getElementById('hero-section');

    const utm = getUTMParams();
    const device = getDeviceType();
    const location = await getUserLocation();
    const weather = await getWeather(location.latitude, location.longitude);
    const timeOfDay = getTimeContext();

    const userData = { 
    utm, 
    device, 
    location, 
    weather, 
    timeOfDay, 
    timestamp: new Date().toISOString(),
    template_id: CONFIG.templateId,
    brand_name: CONFIG.brandName,
    product_description: CONFIG.productDescription
};
    console.log('📊 Visitor Payload:', userData);

    hero.classList.remove('loading');

    if (location.city !== 'Unknown') {
        document.getElementById('user-location-tag').textContent = `${location.city}, ${location.country}`;
        document.getElementById('personalization-badge').style.display = 'block';
    }

    // Call Make.com Webhook
    const personalized = await getPersonalizedContent(userData);
    if (personalized) {
        console.log('✨ Received AI Personalization:', personalized);
        updatePage(personalized);
    }
}
// ============================================
// CONVERSION & EVENT TRACKING ENGINE
// ============================================

// Unique Session ID for this visitor
const visitorSessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

// 1. Track CTA Button Clicks
function initConversionTracking() {
    const ctaButton = document.getElementById('cta-button');
    if (ctaButton) {
        ctaButton.addEventListener('click', function() {
            console.log('🎯 CTA Button Clicked!');
            trackEvent('cta_click');
            
            // Visual Feedback
            ctaButton.textContent = '🎉 Offer Claimed!';
            ctaButton.style.background = '#10b981';
        });
    }

    // 2. Track Scroll Depth
    let maxScroll = 0;
    window.addEventListener('scroll', function() {
        const scrollPercent = Math.round((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
        if (scrollPercent > maxScroll) {
            maxScroll = scrollPercent;
            if (maxScroll >= 50 && maxScroll < 75) trackEvent('scroll_50');
            if (maxScroll >= 90) trackEvent('scroll_100');
        }
    });

    // 3. Track Time on Page (30 Seconds)
    setTimeout(() => {
        trackEvent('time_30s');
    }, 30000);
}

// Send Tracking Event to Make.com
async function trackEvent(eventName) {
    if (!CONFIG.makeWebhookURL) return;
    try {
        await fetch(CONFIG.makeWebhookURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                event_type: eventName,
                session_id: visitorSessionId,
                page_url: window.location.href,
                timestamp: new Date().toISOString()
            })
        });
    } catch (e) {
        console.warn('Event tracking failed:', e);
    }
}
    
document.addEventListener('DOMContentLoaded', shapeShift);
</script>

</body>
</html>
